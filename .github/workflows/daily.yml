name: Daily card and GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'studio/**'
      - 'templates/**'
      - 'library/**'
      - 'settings/**'
      - 'admin/**'
      - 'assets/**'
      - 'data/config.json'
      - 'data/content-library.json'
      - 'data/content-sources.json'
      - 'package.json'
      - 'package-lock.json'
      - 'data/templates/**'
      - 'data/assets.json'
      - 'data/calendar-templates.json'
      - 'scripts/**'
      - '.github/workflows/daily.yml'
  schedule:
    # 22:10 UTC = 01:10 in Saudi Arabia (following calendar day)
    - cron: '10 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: zyad-daily-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packages and browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Generate branded app icons
        run: node scripts/prepare-brand-icons.mjs
      - name: Check dates and counters
        run: npm test
      - name: Check studio in Chromium
        run: |
          node scripts/check-app.mjs
          node scripts/check-settings.mjs
          node scripts/check-calendars.mjs
          node scripts/check-platform.mjs
          node scripts/check-extra.mjs
          node scripts/check-native-visual.mjs
      - name: Render and archive today's poster
        run: |
          node scripts/render.mjs || node scripts/render.mjs
          node scripts/render-smart.mjs || node scripts/render-smart.mjs
      - name: Save generated images to the repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images data/history.json data/generation-log.json assets/qr.png assets/branding/logo-transparent.png assets/app-180.png assets/app-192.png assets/app-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate daily calendar card"
            PUSHED=0
            for ATTEMPT in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase -X theirs origin/main; then
                git rebase --abort || true
                echo "::warning::Could not rebase generated image archive; website build will continue."
                break
              fi
              if git push origin HEAD:main; then
                PUSHED=1
                break
              fi
              sleep 3
            done
            if [ "$PUSHED" -ne 1 ]; then
              echo "::warning::Image archive push deferred after concurrent commits."
            fi
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p dist
          cp index.html manifest.webmanifest sw.js dist/
          cp -R admin assets data images studio templates library settings dist/
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
