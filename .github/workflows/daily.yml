name: Daily card and GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'studio/**'
      - 'admin/**'
      - 'assets/**'
      - 'data/config.json'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/daily.yml'
  schedule:
    # 22:10 UTC = 01:10 in Saudi Arabia (following calendar day)
    - cron: '10 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: zyad-daily-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packages and browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check dates and counters
        run: npm test
      - name: Check studio in Chromium
        run: node scripts/check-studio.mjs
      - name: Render and archive today's poster
        run: node scripts/render.mjs
      - name: Save generated images to the repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images data/history.json assets/qr.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate daily calendar card"
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p dist
          cp index.html manifest.webmanifest sw.js dist/
          cp -R admin assets data images studio dist/
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
